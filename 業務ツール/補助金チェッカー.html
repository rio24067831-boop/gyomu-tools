<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>補助金チェッカー</title>
<!--
  これは何か: 飲食事業者向けの補助金・助成金要件チェッカー。
  主な機能: 会社プロフィールとの照合、3段階判定、制度データ更新、バックアップ、印刷。
  初回起動: プロフィールは未入力（空）。「見本プロフィールを入れる」で見本を投入、「白紙に戻す」で保存内容を全消去して初期状態に戻る。
  データの流れ: 画面入力 → localStorageへ保存 → 同梱制度データと照合 → 判定結果を画面・印刷へ出力。
  外部送信: 一切ありません。外部通信、自動アクセス、外部リソース読み込みは行いません。
-->
<style>
:root{--bg:#f4f6f7;--side:#fff;--card:#fff;--line:#e3e6e9;--ink:#1b2126;--muted:#6b737b;--accent:#1f6f6b;--accent-soft:#e6f2f1;--warn:#b4452a;--warn-soft:#fff7f4;--warn-line:#f3cfc3}
*{box-sizing:border-box}
html,body{margin:0;min-width:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
body{font-variant-numeric:tabular-nums}
button,input,select{font:inherit}
.serif{font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
.app{display:flex;min-height:100vh}

.brand{padding:0 12px 18px;font-size:11px;letter-spacing:.22em;color:var(--muted)}
.nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:8px;color:#3d474f;font-size:14px;text-decoration:none;white-space:nowrap}
.nav .no{font-size:11px;color:var(--muted);width:20px;letter-spacing:.05em}
.nav.current{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav.current .no{color:var(--accent)}
.nav.off{color:#a3aab0}
.nav .tag{font-size:10px;margin-left:auto;color:#a3aab0}
.side .foot{margin-top:auto;padding:12px;font-size:11px;color:var(--muted);line-height:1.6}
.main{min-width:0;flex:1;padding:30px 36px;display:flex;flex-direction:column;gap:22px}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head-title{margin-right:auto}
.sub{font-size:12px;color:var(--muted);letter-spacing:.08em}
h1{margin:6px 0 0;font-size:30px;font-weight:600;letter-spacing:.06em}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:38px;padding:0 14px;border-radius:8px;border:1px solid #d9dde1;background:#fff;color:var(--ink);font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .k{font-size:11px;color:var(--muted);letter-spacing:.1em}
.tile .v{font-size:42px;line-height:1.05;letter-spacing:-.01em;overflow-wrap:anywhere}
.tile .v.date{font-size:27px}
.tile .v small{font-size:16px;margin-left:5px;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel-bar{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.panel-bar h2{margin:0;font-size:18px;font-weight:600;letter-spacing:.04em}
.panel-meta{margin-left:auto;font-size:12px;color:var(--muted)}
.profile-body{padding:18px}
.profile-grid{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.group-title{font-size:12px;color:var(--muted);font-weight:600}
.field input,.field select{width:100%;min-height:40px;border:1px solid #d9dde1;border-radius:7px;padding:7px 10px;background:#fff;color:var(--ink)}
.field input:focus,.field select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.form-group{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.checks{display:flex;gap:10px 20px;flex-wrap:wrap;margin-top:10px}
.check{display:flex;align-items:center;gap:7px;font-size:13px}
.plans{display:grid;grid-template-columns:repeat(3,minmax(180px,1fr));gap:12px;margin-top:10px}
.plan-row{display:grid;grid-template-columns:88px 1fr;align-items:center;gap:8px}
.plan-row label{font-size:13px}
.plan-row select{min-width:0;min-height:38px;border:1px solid #d9dde1;border-radius:7px;background:#fff;padding:6px}
.message{display:none;margin:0;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px}
.message.show{display:block}
.message.error{color:var(--warn);background:var(--warn-soft);border-color:var(--warn-line)}
.message.ok{color:var(--accent);background:var(--accent-soft);border-color:#c7e1df}
.results{display:grid;gap:18px}
.result-panel.ready{border-top:3px solid var(--accent)}
.result-panel.possible{border-top:3px solid #82958f}
.result-panel.out{border-top:3px solid #a7adb2}
.result-panel.closed{border-top:3px solid var(--warn)}
.result-list{display:flex;flex-direction:column}
.empty{padding:24px 18px;color:var(--muted);font-size:13px}
.scheme{border-bottom:1px solid #eef0f2}
.scheme:last-child{border-bottom:0}
.scheme-summary{width:100%;border:0;background:#fff;color:var(--ink);text-align:left;padding:15px 18px;cursor:pointer;display:grid;grid-template-columns:minmax(220px,2fr) minmax(130px,1fr) minmax(160px,1.4fr) minmax(160px,1.5fr) 20px;gap:16px;align-items:center}
.scheme-summary:hover{background:#fafbfb}
.scheme-name{font-weight:700;line-height:1.5}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.badge{display:inline-block;padding:2px 7px;border:1px solid var(--line);border-radius:999px;font-size:10px;color:var(--muted);font-weight:600}
.badge.warn{color:var(--warn);background:var(--warn-soft);border-color:var(--warn-line)}
.money,.deadline,.reason{font-size:12px;line-height:1.55;color:#485159}
.reason strong{display:block;color:var(--ink);font-size:11px;margin-bottom:2px}
.chevron{font-size:18px;color:var(--muted);transition:transform .15s}
.scheme.open .chevron{transform:rotate(180deg)}
.details{display:none;background:#fafbfb;border-top:1px solid var(--line);padding:18px}
.scheme.open .details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 24px}
.detail-block h3{font-size:11px;color:var(--muted);letter-spacing:.08em;margin:0 0 6px}
.detail-block p,.detail-block li{font-size:13px;line-height:1.7;margin:0}
.detail-block ul{margin:0;padding-left:19px}
.detail-block.wide{grid-column:1/-1}
.source{overflow-wrap:anywhere;color:var(--accent)}
.dialog{border:1px solid var(--line);border-radius:12px;padding:0;width:min(520px,calc(100vw - 30px));color:var(--ink)}
.dialog::backdrop{background:rgba(27,33,38,.35)}
.dialog-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.dialog-head h2{font-size:18px;margin:0}
.dialog-body{padding:18px;line-height:1.7;font-size:13px}
.dialog-actions{padding:0 18px 18px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.hidden{display:none!important}
@media(max-width:1050px){.profile-grid{grid-template-columns:repeat(2,minmax(140px,1fr))}.scheme-summary{grid-template-columns:minmax(180px,2fr) minmax(120px,1fr) minmax(140px,1.2fr) 20px}.scheme-summary .reason{grid-column:1/-1}}
@media(max-width:800px){.app{flex-direction:column}.side{width:auto;flex:0 0 auto;max-height:128px;overflow:auto;flex-direction:row;flex-wrap:nowrap;padding:10px;border-right:0;border-bottom:1px solid var(--line)}.brand,.side .foot{display:none}.nav{flex:0 0 auto}.main{padding:18px;gap:16px}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.plans{grid-template-columns:repeat(2,minmax(150px,1fr))}}
@media(max-width:520px){.main{padding:12px}.head{align-items:flex-start}.actions{width:100%}.actions .btn{flex:1 1 45%;padding:0 8px}.tile{padding:14px}.tile .v{font-size:34px}.tile .v.date{font-size:20px}.profile-grid,.plans{grid-template-columns:1fr}.scheme-summary{grid-template-columns:minmax(0,1fr) 20px;padding:14px;gap:8px}.scheme-summary>div:not(.scheme-name),.scheme-summary>.reason{grid-column:1/-1}.scheme-summary>.chevron{grid-column:2;grid-row:1}.scheme.open .details{grid-template-columns:1fr;padding:14px}.detail-block.wide{grid-column:auto}}
@media print{@page{size:A4;margin:10mm}.side,.actions,.profile-panel,.message,.chevron{display:none!important}.main{padding:0;gap:8px}.head{display:block}.sub{font-size:9px}h1{font-size:22px}.tiles{gap:5px}.tile,.panel{border-color:#000;border-radius:0;break-inside:avoid}.tile{padding:7px}.tile .k{font-size:8px}.tile .v,.tile .v.date{font-size:17px}.panel-bar{padding:7px 9px;border-color:#000}.panel-bar h2{font-size:14px}.scheme{border-color:#000;break-inside:avoid}.scheme-summary{padding:7px 9px;grid-template-columns:2fr 1fr 1.3fr 1.5fr;gap:7px}.scheme-name{font-size:11px}.money,.deadline,.reason{font-size:9px}.details{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 12px;padding:7px 9px;border-color:#000}.detail-block h3{font-size:8px;margin-bottom:2px}.detail-block p,.detail-block li{font-size:8px;line-height:1.35}.detail-block ul{padding-left:13px}.badge{font-size:7px;padding:1px 4px}.results{gap:7px}}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="sidebar"><div class="brand">業務ツール</div><div class="foot">データはこのパソコンの中にだけ保存されます。<br>ネット通信なし。<br>画面バージョン: 2026-09-06</div></aside>
<main class="main">
<header class="head">
<div class="head-title"><div class="sub"><span id="companySub">名称未設定</span> ・ 制度データ <span id="dataUpdatedSub">2026-09-05</span> 更新</div><h1 class="serif">補助金チェッカー</h1></div>
<div class="actions">
<button class="btn primary" id="profileButton" type="button">会社プロフィール</button>
<button class="btn" id="dataButton" type="button">制度データを更新</button>
<button class="btn" id="backupButton" type="button">バックアップ</button>
<button class="btn" id="printButton" type="button">印刷</button>
</div>
</header>
<p class="message" id="message" role="status" aria-live="polite"></p>
<p class="message error" id="freshnessMessage" role="status"></p>
<section class="tiles" aria-label="判定概要">
<div class="tile"><div class="k">今すぐ候補</div><div class="v serif"><span id="readyCount">0</span><small>件</small></div></div>
<div class="tile"><div class="k">こうすれば候補</div><div class="v serif"><span id="possibleCount">0</span><small>件</small></div></div>
<div class="tile"><div class="k">直近の締切</div><div class="v date serif" id="nearestDeadline">なし</div></div>
<div class="tile"><div class="k">制度データ更新日</div><div class="v date serif" id="dataUpdated">―</div></div>
</section>
<section class="panel profile-panel" id="profilePanel">
<div class="panel-bar"><h2 class="serif">会社プロフィール</h2><span class="panel-meta">変更内容はこのパソコンに即時保存されます</span><button class="btn" id="sampleProfileButton" type="button" style="margin-left:auto">見本プロフィールを入れる</button><button class="btn" id="resetAllButton" type="button">白紙に戻す</button></div>
<form class="profile-body" id="profileForm">
<div class="profile-grid">
<div class="field"><label for="company">会社・店舗名</label><input id="company" name="company" maxlength="80"></div>
<div class="field"><label for="gyoshu">業種</label><input id="gyoshu" name="gyoshu" maxlength="40"></div>
<div class="field"><label for="pref">都道府県</label><input id="pref" name="pref" maxlength="20"></div>
<div class="field"><label for="city">市区町村</label><input id="city" name="city" maxlength="40"></div>
<div class="field"><label for="employees">従業員数</label><input id="employees" name="employees" type="number" min="0" max="1000000" step="1"></div>
<div class="field"><label for="capital">資本金（万円）</label><input id="capital" name="capital" type="number" min="0" max="100000000" step="1"></div>
<div class="field"><label for="founded_year">創業年</label><input id="founded_year" name="founded_year" type="number" min="1800" max="2100" step="1"></div>
<div class="field"><label for="entity">法人／個人</label><select id="entity" name="entity"><option value="法人">法人</option><option value="個人">個人</option></select></div>
</div>
<div class="form-group"><div class="group-title">過去に受けた制度</div><div class="checks" id="receivedChecks"></div></div>
<div class="form-group"><div class="group-title">この先の予定</div><div class="plans" id="planFields"></div></div>
</form>
</section>
<section class="results" id="results"></section>
</main>
</div>
<input class="hidden" id="dataFile" type="file" accept=".json,application/json">
<input class="hidden" id="backupFile" type="file" accept=".json,application/json">
<dialog class="dialog" id="backupDialog">
<div class="dialog-head"><h2 class="serif">バックアップ</h2></div>
<div class="dialog-body">会社プロフィールと現在の制度データをJSONファイルに保存、または保存済みファイルから復元できます。</div>
<div class="dialog-actions"><button class="btn" id="backupClose" type="button">閉じる</button><button class="btn" id="backupImport" type="button">読み込む</button><button class="btn primary" id="backupExport" type="button">書き出す</button></div>
</dialog>

  node.className="message show " + (type||"ok");
}
function clearMessage(){
  const node=document.getElementById("message");
  node.textContent="";
  node.className="message";
}
function formatDate(dateText){
  if(!dateText) return "締切未定";
  const parts=dateText.split("-");
  return Number(parts[0]) + "/" + Number(parts[1]) + "/" + Number(parts[2]);
}
function displayCheckedValue(value){return value===null?"確認中（出典を確認）":value;}
function isPlainObject(value){return value!==null && typeof value==="object" && !Array.isArray(value);}
function isRealDate(value){
  if(typeof value!=="string" || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
  const p=value.split("-").map(Number);
  const d=new Date(Date.UTC(p[0],p[1]-1,p[2]));
  return d.getUTCFullYear()===p[0] && d.getUTCMonth()===p[1]-1 && d.getUTCDate()===p[2];
}
function todayText(){
  if(testToday) return testToday;
  const now=new Date();
  return [now.getFullYear(),String(now.getMonth()+1).padStart(2,"0"),String(now.getDate()).padStart(2,"0")].join("-");
}
function dayNumber(dateText){
  const p=dateText.split("-").map(Number);
  return Date.UTC(p[0],p[1]-1,p[2])/86400000;
}
function daysFromToday(dateText){return dayNumber(dateText)-dayNumber(todayText());}
function isFiniteInRange(value,min,max,integerOnly){
  return typeof value==="number" && Number.isFinite(value) && value>=min && value<=max && (!integerOnly || Number.isInteger(value));
}

// ---- 型検証 ----
function validateProfile(candidate){
  if(!isPlainObject(candidate)) throw new Error("会社プロフィールがオブジェクトではありません。");
  const textRules=[["company",80],["gyoshu",40],["pref",20],["city",40]];
  textRules.forEach(function(rule){
    if(typeof candidate[rule[0]]!=="string" || candidate[rule[0]].length>rule[1]) throw new Error(rule[0] + "の値が不正です。");
  });
  if(candidate.employees!==null && !isFiniteInRange(candidate.employees,0,1000000,true)) throw new Error("従業員数は0～1,000,000の整数で指定してください（未入力可）。");
  if(candidate.capital!==null && !isFiniteInRange(candidate.capital,0,100000000,true)) throw new Error("資本金は0～100,000,000万円の整数で指定してください（未入力可）。");
  if(candidate.founded_year!==null && !isFiniteInRange(candidate.founded_year,1800,2100,true)) throw new Error("創業年は1800～2100年の整数で指定してください（未入力可）。");
  if(!["法人","個人"].includes(candidate.entity)) throw new Error("法人／個人の値が不正です。");
  if(!Array.isArray(candidate.received) || candidate.received.some(function(v){return !RECEIVED_NAMES.includes(v);})) throw new Error("過去受給歴の値が不正です。");
  if(!isPlainObject(candidate.plan) || PLAN_NAMES.some(function(name){return !PLAN_VALUES.includes(candidate.plan[name]);})) throw new Error("予定の値が不正です。");
  return true;
}
function validateCondition(condition,schemeIndex,conditionIndex){
  if(!isPlainObject(condition)) throw new Error("制度" + (schemeIndex+1) + "の条件" + (conditionIndex+1) + "が不正です。");
  if(typeof condition.field!=="string" || !ALLOWED_FIELDS.includes(condition.field)) throw new Error("制度" + (schemeIndex+1) + "の条件fieldが語彙外です。");
  if(typeof condition.op!=="string" || !ALLOWED_OPS.includes(condition.op)) throw new Error("制度" + (schemeIndex+1) + "の条件opが語彙外です。");
  if(typeof condition.説明!=="string" || !["対象外","こうすれば"].includes(condition.fail)) throw new Error("制度" + (schemeIndex+1) + "の条件説明またはfailが不正です。");
  if(condition.op==="plan" && !condition.field.startsWith("plan.")) throw new Error("plan条件のfieldが不正です。");
  if(["lte","gte"].includes(condition.op) && (typeof condition.value!=="number" || !Number.isFinite(condition.value))) throw new Error("数値比較条件のvalueが有限数ではありません。");
  if(condition.op==="in" && !Array.isArray(condition.value)) throw new Error("in条件のvalueが配列ではありません。");
  if(condition.不足時の行動!==null && typeof condition.不足時の行動!=="string") throw new Error("不足時の行動が文字列またはnullではありません。");
}
function validateSeidoData(candidate){
  if(!isPlainObject(candidate)) throw new Error("制度データ全体がオブジェクトではありません。");
  if(typeof candidate.データ名!=="string" || typeof candidate.version!=="string" || !isRealDate(candidate.更新日) || !isPlainObject(candidate.対象地域)) throw new Error("制度データの基本情報が不正です。");
  if(!Array.isArray(candidate.制度)) throw new Error("制度は配列で指定してください。");
  const ids=new Set();
  candidate.制度.forEach(function(scheme,index){
    if(!isPlainObject(scheme)) throw new Error("制度" + (index+1) + "がオブジェクトではありません。");
    REQUIRED_SCHEME_KEYS.forEach(function(key){if(!Object.prototype.hasOwnProperty.call(scheme,key)) throw new Error("制度" + (index+1) + "に必須キー「" + key + "」がありません。");});
    if(typeof scheme.id!=="string" || !scheme.id || ids.has(scheme.id)) throw new Error("制度" + (index+1) + "のidが空または重複しています。");
    ids.add(scheme.id);
    ["名前","区分","level","実施主体","目的","申請の流れ","注意","source_url","checked_date","確度"].forEach(function(key){if(typeof scheme[key]!=="string") throw new Error("制度「" + scheme.id + "」の" + key + "が文字列ではありません。");});
    ["補助率","上限額","過去受給歴キー"].forEach(function(key){if(scheme[key]!==null && typeof scheme[key]!=="string") throw new Error("制度「" + scheme.id + "」の" + key + "が文字列またはnullではありません。");});
    if(!isRealDate(scheme.checked_date)) throw new Error("制度「" + scheme.id + "」の確認日が実在する日付ではありません。");
    if(!Array.isArray(scheme.条件)) throw new Error("制度「" + scheme.id + "」の条件が配列ではありません。");
    scheme.条件.forEach(function(c,ci){validateCondition(c,index,ci);});
    if(!Array.isArray(scheme.受けるための行動) || scheme.受けるための行動.some(function(v){return typeof v!=="string";})) throw new Error("制度「" + scheme.id + "」の行動が不正です。");
    if(!isPlainObject(scheme.締切) || !Object.prototype.hasOwnProperty.call(scheme.締切,"次回締切") || typeof scheme.締切.公募時期!=="string" || typeof scheme.締切.通年!=="boolean") throw new Error("制度「" + scheme.id + "」の締切情報が不正です。");
    if(scheme.締切.次回締切!==null && !isRealDate(scheme.締切.次回締切)) throw new Error("制度「" + scheme.id + "」の締切日が実在する日付ではありません。");
  });
  return true;
}
function validateBackup(candidate){
  if(!isPlainObject(candidate) || candidate.kind!==BACKUP_KIND || candidate.version!==1) throw new Error("この補助金チェッカーのバックアップではありません。");
  validateProfile(candidate.profile);
  validateSeidoData(candidate.seidoData);
  return true;
}

// ---- 判定 ----
function compareCondition(actual,condition){
  switch(condition.op){
    case "eq": return actual===condition.value;
    case "ne": return actual!==condition.value;
    case "lte": return typeof actual==="number" && actual<=condition.value;
    case "gte": return typeof actual==="number" && actual>=condition.value;
    case "in": return Array.isArray(condition.value) && condition.value.includes(actual);
    default:return false;
  }
}
function planLabel(field){return field.slice("plan.".length);}
function judgeScheme(scheme){
  if(scheme.締切.次回締切 && daysFromToday(scheme.締切.次回締切)<0){
    return {stage:"締切済み",reasons:["募集終了（"+scheme.締切.次回締切+"）。次回公募は更新データで反映"]};
  }
  const outReasons=[];
  const missing=[];
  scheme.条件.forEach(function(condition){
    const actual=getFieldValue(profile,condition.field);
    if(condition.op==="plan"){
      if(actual==="検討中") missing.push(condition.不足時の行動 || condition.説明);
      if(actual==="なし") outReasons.push(planLabel(condition.field) + "の予定がない");
      return;
    }
    if(!compareCondition(actual,condition)){
      if(condition.fail==="対象外") outReasons.push(condition.説明);
      else missing.push(condition.不足時の行動 || condition.説明);
    }
  });
  if(outReasons.length) return {stage:"対象外",reasons:outReasons};
  if(missing.length) return {stage:"こうすれば",reasons:missing};
  return {stage:"今すぐ",reasons:[]};
}
function deadlineSort(a,b){
  const ad=a.scheme.締切.次回締切;
  const bd=b.scheme.締切.次回締切;
  if(ad===null && bd===null) return a.scheme.名前.localeCompare(b.scheme.名前,"ja");
  if(ad===null) return 1;
  if(bd===null) return -1;
  return ad.localeCompare(bd) || a.scheme.名前.localeCompare(b.scheme.名前,"ja");
}
function calculateJudgement(){
  const result={"今すぐ":[],"こうすれば":[],"対象外":[],"締切済み":[]};
  activeData.制度.forEach(function(scheme){
    const judged=judgeScheme(scheme);
    result[judged.stage].push({scheme:scheme,reasons:judged.reasons});
  });
  Object.keys(result).forEach(function(key){result[key].sort(deadlineSort);});
  judgement=result;
  return result;
}

    item.reasons.forEach(function(text,index){if(index) reason.append(el("br"));reason.append(document.createTextNode("・"+text));});

// ---- JSON読み込みとバックアップ ----
function readJsonFile(file,onSuccess){
  if(!file) return;
  const reader=new FileReader();
  reader.addEventListener("load",function(){
    try{onSuccess(JSON.parse(String(reader.result)));}
    catch(error){showMessage("JSONを読み込めませんでした。既存データは変更していません。理由: "+error.message,"error");}
  });
  reader.addEventListener("error",function(){showMessage("ファイルを読み込めませんでした。既存データは変更していません。","error");});
  reader.readAsText(file,"UTF-8");
}
function downloadJson(filename,value){
  const blob=new Blob([JSON.stringify(value,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const link=el("a");link.href=url;link.download=filename;document.body.append(link);link.click();link.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},0);
}
function makeBackup(){
  return {kind:BACKUP_KIND,version:1,createdAt:new Date().toISOString(),profile:cloneValue(profile),seidoData:cloneValue(activeData)};
}
function importSeido(candidate){
  validateSeidoData(candidate);
  const oldData=activeData;
  activeData=cloneValue(candidate);
  try{saveData();}
  catch(error){activeData=oldData;throw error;}
  renderAll();
}
function importBackup(candidate){
  validateBackup(candidate);
  const oldProfile=profile,oldData=activeData;
  profile=cloneValue(candidate.profile);activeData=cloneValue(candidate.seidoData);
  try{
    localStorage.setItem(STORAGE_PROFILE,JSON.stringify(profile));
    localStorage.setItem(STORAGE_DATA,JSON.stringify(activeData));
  }catch(error){
    profile=oldProfile;activeData=oldData;
    throw new Error("バックアップをこのブラウザに保存できませんでした。");
  }
  renderProfileInputs();renderAll();
}

  getJudgement:function(){
    return {
      "今すぐ":judgement["今すぐ"].map(function(item){return item.scheme.id;}),
      "こうすれば":judgement["こうすれば"].map(function(item){return item.scheme.id;}),
      "対象外":judgement["対象外"].map(function(item){return item.scheme.id;}),
      "締切済み":judgement["締切済み"].map(function(item){return item.scheme.id;})
    };
  },
  setToday:function(dateText){
    if(dateText!==undefined && dateText!==null && !isRealDate(dateText)) throw new Error("今日の日付はYYYY-MM-DD形式の実在する日付で指定してください。");
    testToday=dateText||null;
    renderAll();
  }
};

function initialize(){
  try{
    validateSeidoData(SEIDO_DATA);
    restoreStorage();
    renderSidebar();
    renderProfileInputs();
    renderAll();
    bindEvents();
  }catch(error){
    profile=cloneValue(EMPTY_PROFILE);
    activeData=cloneValue(SEIDO_DATA);
    judgement={"今すぐ":[],"こうすれば":[],"対象外":[],"締切済み":[]};
    try{renderSidebar();}catch(ignore){}
    try{renderProfileInputs();}catch(ignore){}
    try{renderAll();}catch(ignore){}
    try{bindEvents();}catch(ignore){}
    showMessage("起動時にエラーが発生したため、未入力の初期状態で表示しました。理由: "+error.message,"error");
  }
}
initialize();
</script>
</body>
</html>
