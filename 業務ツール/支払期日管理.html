<!doctype html>
<!--
  支払期日管理: 飲食店の支払先、月ごとの予定、支払済み状態を一つの画面で管理するファイルです。
  主な機能: 支払先マスター、月別予定、前々日通知付きカレンダー、資金繰り用JSON、
  CSV・貼り付け一括取り込み、完全バックアップの書き出しと復元。
  データの流れ: 画面・ファイル入力 → 検証 → ブラウザ内保存 → 画面表示・ファイル出力。
  データはブラウザの localStorage だけに保存し、外部送信・外部通信は一切行いません。
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>支払期日管理</title>
<style>
:root{--bg:#f4f6f7;--side:#fff;--card:#fff;--line:#e3e6e9;--row:#eef0f2;--ink:#1b2126;--muted:#6b737b;--accent:#1f6f6b;--accent-soft:#e6f2f1;--warn:#b4452a;--warn-soft:#fff7f4;--warn-line:#f3cfc3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}.serif,h1,h2,.tile .v{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;letter-spacing:.06em}.app{display:flex;min-height:100vh}.side{width:232px;flex:0 0 232px;background:var(--side);border-right:1px solid var(--line);padding:26px 14px;display:flex;flex-direction:column;gap:4px}.brand{padding:0 12px 18px;font-size:11px;letter-spacing:.22em;color:var(--muted)}#sidebarNav{display:contents}.nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:8px;color:#3d474f;font-size:14px;text-decoration:none;white-space:nowrap}.nav .no{font-size:11px;color:var(--muted);width:20px;letter-spacing:.05em}.nav.on{background:var(--accent-soft);color:var(--accent);font-weight:700}.nav.on .no{color:var(--accent)}.nav.off{color:#a3aab0;cursor:default}.nav.off .tag{font-size:10px;margin-left:auto}.side .foot{margin-top:auto;padding:12px;font-size:11px;color:var(--muted);line-height:1.6}.main{min-width:0;flex:1;padding:30px 36px;display:flex;flex-direction:column;gap:22px}.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}.head .sub{font-size:12px;color:var(--muted);letter-spacing:.1em}.head h1{margin:6px 0 0;font-size:30px;font-weight:600}.spacer{flex:1}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{min-height:38px;padding:8px 16px;border-radius:8px;border:1px solid #d9dde1;background:#fff;color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer}.btn:hover{border-color:var(--accent)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}.btn.danger{color:var(--warn)}.btn.small{min-height:30px;padding:5px 10px;font-size:12px}.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}.tile .k{font-size:11px;color:var(--muted);letter-spacing:.12em}.tile .v{font-size:42px;line-height:1.05}.tile .v small{font:16px "Hiragino Sans","Yu Gothic",sans-serif;margin-left:6px;color:var(--muted)}.tile.warn{background:var(--warn-soft);border-color:var(--warn-line)}.tile.warn .k,.tile.warn .v,.tile.warn small{color:var(--warn)}.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}.panel .bar{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}.panel .bar h2{margin:0;font-size:18px;font-weight:600}.month-control{display:flex;align-items:center;gap:8px}.month-title{min-width:110px;text-align:center;font-weight:700}.muted,.hint{color:var(--muted);font-size:12px}.notice{display:none;padding:12px 16px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px}.notice.show{display:block}.notice.error{color:var(--warn);background:var(--warn-soft);border-color:var(--warn-line)}.notice.ok{color:var(--accent);background:var(--accent-soft)}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:860px}th{font-size:11px;font-weight:600;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);letter-spacing:.08em;white-space:nowrap}td{padding:12px 14px;border-bottom:1px solid var(--row);font-size:14px;vertical-align:middle}tr:last-child td{border-bottom:0}tr.urgent td{background:var(--warn-soft);color:var(--warn)}tr.done td{color:var(--muted);text-decoration:line-through}.r{text-align:right}.amount-input{width:120px;text-align:right}.badge{display:inline-block;padding:3px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700}.badge.estimate{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-line)}input,select,textarea{width:100%;border:1px solid #d9dde1;border-radius:8px;background:#fff;color:var(--ink);font:inherit;font-size:14px;padding:9px 10px}input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}.empty{padding:28px;text-align:center;color:var(--muted)}.master-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:16px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;color:var(--muted);font-weight:600}.field.wide{grid-column:span 2}.master-list{padding:0 16px 16px}.master-card{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--row);font-size:13px}.master-card:last-child{border-bottom:0}.import-area{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px}.import-area textarea{min-height:150px;resize:vertical}.mapping{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:0 16px 16px}.preview{padding:0 16px 16px}.preview-line{padding:7px 9px;border-bottom:1px solid var(--row);font-size:12px}.preview-line.error{color:var(--warn);background:var(--warn-soft)}.section-help{padding:0 18px 14px;color:var(--muted);font-size:12px;line-height:1.7}.hidden{display:none!important}.file-label{display:inline-flex;align-items:center}.file-label input{display:none}dialog{width:min(680px,calc(100% - 24px));border:1px solid var(--line);border-radius:12px;padding:0;background:#fff;color:var(--ink)}dialog::backdrop{background:rgba(27,33,38,.35)}.dialog-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center}.dialog-head h2{margin:0;font-size:18px}.dialog-body{padding:18px}.dialog-actions{padding:14px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid .wide{grid-column:1/-1}.day-fields{display:flex;gap:8px}.day-fields>*{flex:1}.check-label{display:flex;align-items:center;gap:8px;font-size:13px}.check-label input{width:18px}.screen-only{}@media(max-width:1100px){.master-card{grid-template-columns:1.5fr 1fr 1fr auto}.master-card .memo{display:none}}@media(max-width:800px){.app{flex-direction:column}.side{width:auto;flex:0 0 auto;flex-direction:row;flex-wrap:nowrap;padding:10px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.side .foot,.brand{display:none}.nav{padding:9px}.nav .tag{display:none}.main{padding:18px;gap:16px}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{padding:14px}.tile .v{font-size:34px}.head{align-items:flex-start}.head .spacer{display:none}.actions{width:100%}.actions .btn,.actions .file-label{flex:1}.master-grid,.import-area{grid-template-columns:1fr}.field.wide{grid-column:auto}.mapping{grid-template-columns:1fr 1fr}.master-card{grid-template-columns:1fr auto}.master-card .secondary{display:none}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}}@media(max-width:430px){.main{padding:12px}.tiles{gap:8px}.tile .v{font-size:29px}.btn{padding:8px 10px}.mapping{grid-template-columns:1fr}}@media print{.side,.actions,.screen-only,#message,.import-panel,.master-actions{display:none!important}.main{padding:0;gap:10px}.tile,.panel{border-color:#000}.tiles{grid-template-columns:repeat(4,1fr)}body{background:#fff}.panel{break-inside:avoid}table{min-width:0;font-size:10px}th,td{padding:5px}}
tr.overdue td{background:var(--warn-soft);color:var(--warn);font-weight:600}.badge.overdue{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-line)}.overdue-notice{padding:10px 18px;color:var(--warn);background:var(--warn-soft);border-bottom:1px solid var(--warn-line);font-size:13px;font-weight:700}
</style>
</head>
<body>
<div class="app">
<aside class="side" aria-label="業務ツール一覧">
  <div class="brand">業務ツール</div>
  <nav id="sidebarNav"></nav>
  <div class="foot">データはこのパソコンの中にだけ保存されます。ネット通信なし。<br>画面バージョン: 2026-09-06</div>
</aside>
<main class="main">
  <header class="head">
    <div><div class="sub" id="updatedLabel">店舗 ・ 更新日</div><h1>支払期日管理</h1></div><div class="spacer"></div>
    <div class="actions screen-only">
      <button class="btn" id="icsButton">カレンダー</button><button class="btn" id="paymentsButton">資金繰り用</button>
      <button class="btn" id="backupButton">バックアップ</button><label class="btn file-label">読み込み<input id="backupInput" type="file" accept="application/json,.json"></label>
      <button class="btn primary" id="addButton">支払先を追加</button>
    </div>
  </header>
  <div id="message" class="notice" role="status"></div>
  <section class="tiles" aria-label="今月の概要">
    <div class="tile"><div class="k">今月の支払件数</div><div class="v"><span id="countTile">0</span><small>件</small></div></div>
    <div class="tile"><div class="k">今月の支払合計</div><div class="v"><span id="totalTile">0</span><small>円</small></div></div>
    <div class="tile warn"><div class="k">3日以内</div><div class="v"><span id="urgentTile">0</span><small>件</small></div></div>
    <div class="tile"><div class="k">支払済み</div><div class="v"><span id="doneTile">0</span><small>件</small></div></div>
  </section>
  <section class="panel">
    <div class="bar"><h2>支払予定一覧</h2><div class="spacer"></div><div class="month-control screen-only"><button class="btn small" id="prevMonth">前月</button><span class="month-title" id="monthLabel"></span><button class="btn small" id="nextMonth">翌月</button></div><label class="check-label screen-only"><input id="showDone" type="checkbox">済みも表示</label></div>
    <div id="overdueNotice" class="overdue-notice hidden"></div>
    <div class="table-wrap"><table><thead><tr><th>済み</th><th>支払日</th><th>相手</th><th class="r">金額</th><th>科目</th><th>口座</th><th>状態</th></tr></thead><tbody id="scheduleBody"></tbody></table></div>
    <div id="scheduleEmpty" class="empty hidden">表示する支払予定はありません。</div>
  </section>
  <section class="panel">
    <div class="bar"><h2>支払先マスター</h2><div class="spacer"></div><span class="muted" id="masterCount"></span><button class="btn small screen-only" id="demoButton">見本データを入れる</button><button class="btn small danger screen-only" id="clearButton">白紙に戻す</button></div>
    <div id="masterList" class="master-list"></div>
  </section>
  <section class="panel import-panel">
    <div class="bar"><h2>一括取り込み</h2><div class="spacer"></div><button class="btn small" id="analyzeImport">列を確認</button></div>
    <div class="import-area"><div class="field"><label for="csvFile">CSVファイル</label><input id="csvFile" type="file" accept="text/csv,.csv,text/plain"></div><div class="field"><label for="pasteArea">または、表を貼り付け</label><textarea id="pasteArea" placeholder="相手,金額,支払日,区分,口座,メモ&#10;例示青果,45000,25,固定,運営口座,毎月分"></textarea></div></div>
    <div class="section-help"><label class="check-label"><input id="hasHeader" type="checkbox" checked>1行目を見出しとして扱う</label>「支払日」は 25、月末、第2火曜 のいずれかで入力できます。列の確認後、対応を選んでプレビューしてください。</div>
    <div id="mappingArea" class="mapping hidden"></div>
    <div id="previewArea" class="preview hidden"><div id="previewSummary" class="section-help"></div><div id="previewLines"></div><div style="padding-top:12px"><button class="btn" id="previewImport">取り込み前に確認</button> <button class="btn primary hidden" id="executeImport">正常な行を取り込む</button></div></div>
  </section>
</main>
</div>

<dialog id="masterDialog">
  <form id="masterForm" method="dialog">
    <div class="dialog-head"><h2 id="dialogTitle">支払先を追加</h2></div>
    <div class="dialog-body form-grid">
      <input id="editId" type="hidden">
      <div class="field wide"><label for="payeeInput">相手</label><input id="payeeInput" required maxlength="80"></div>
      <div class="field"><label for="amountInput">金額</label><input id="amountInput" required inputmode="decimal" placeholder="45,000"></div>
      <div class="field"><label for="kindInput">区分</label><select id="kindInput"><option value="fixed">固定</option><option value="variable">変動</option></select></div>
      <div class="field"><label for="ruleInput">支払日方式</label><select id="ruleInput"><option value="day">毎月○日</option><option value="weekday">第n曜日</option><option value="end">月末</option></select></div>
      <div class="field day-fields" id="dayFields"><div><label for="dayInput">日</label><input id="dayInput" type="number" min="1" max="31" value="25"></div></div>
      <div class="field day-fields hidden" id="weekdayFields"><div><label for="weekInput">第何週</label><select id="weekInput"><option value="1">第1</option><option value="2">第2</option><option value="3">第3</option><option value="4">第4</option><option value="5">第5</option></select></div><div><label for="weekdayInput">曜日</label><select id="weekdayInput"><option value="1">月曜</option><option value="2">火曜</option><option value="3">水曜</option><option value="4">木曜</option><option value="5">金曜</option></select></div></div>
      <div class="field"><label for="accountInput">支払口座</label><input id="accountInput" maxlength="50"></div>
      <div class="field"><label for="categoryInput">科目</label><select id="categoryInput"><option>家賃</option><option>リース</option><option>仕入</option><option>水道光熱</option><option>通信</option><option selected>その他</option></select></div>
      <div class="field wide"><label for="memoInput">メモ</label><textarea id="memoInput" maxlength="300"></textarea></div>
    </div>
    <div class="dialog-actions"><button class="btn" type="button" id="cancelDialog">やめる</button><button class="btn primary" type="submit">保存</button></div>
  </form>
</dialog>
<script>
"use strict";

// ---- サイドバー項目一覧（導入済みフラグはここだけ触る） ----
const SIDEBAR_TOOLS=[
  {no:"01",name:"日報分析",file:"./日報分析.html",installed:true},
  {no:"02",name:"資金繰り表",file:"./資金繰り表.html",installed:true},
  {no:"03",name:"原価管理",file:"./原価管理.html",installed:true},
  {no:"04",name:"月次PL",file:"./月次PL.html",installed:true},
  {no:"05",name:"給与明細作成",file:"./給与明細作成.html",installed:true},
  {no:"06",name:"支払期日管理",file:"./支払期日管理.html",installed:true},
  {no:"07",name:"採用管理",file:"./採用管理.html",installed:true},
  {no:"08",name:"補助金チェッカー",file:"./補助金チェッカー.html",installed:true},
  {no:"09",name:"備品発注リスト",file:"./備品発注リスト.html",installed:true}
];
const このツールの番号="06"; // サイドバーで今の画面として強調する項目

// サイドバーを配列から組み立てる（部品はcreateElementのみで作る）
function サイドバーを描画(){
  const 置き場=document.getElementById("sidebarNav");
  if(!置き場)return;
  置き場.replaceChildren();
  SIDEBAR_TOOLS.forEach(tool=>{
    const 番号=document.createElement("span");
    番号.className="no";番号.textContent=tool.no;
    let 項目;
    if(tool.installed){
      項目=document.createElement("a");
      項目.href=tool.file;
      項目.className=tool.no===このツールの番号?"nav on":"nav";
      項目.append(番号,document.createTextNode(tool.name));
    }else{
      項目=document.createElement("span");
      項目.className="nav off";
      const 札=document.createElement("span");
      札.className="tag";札.textContent="未導入";
      項目.append(番号,document.createTextNode(tool.name),札);
    }
    置き場.append(項目);
  });
}

// ---- 基本設定と見本データ ----
const 保存キー="freesia-payment-manager-v1";
const バックアップ形式="freesia-payment-manager-backup";
const 金額上限=1000000000; // 誤入力を防ぎつつ、店舗支払として十分な上限（10億円）
const 科目一覧=["家賃","リース","仕入","水道光熱","通信","その他"];
const 曜日名=["日","月","火","水","木","金","土"];
const 見本名称=["あおば青果","みなもと鮮魚","あおば青果","しろかね米穀","つばき調味料","かえで乾物","ひなた豆腐","みどり製麺","さざなみ厨房設備","こまち店舗賃貸","はるかぜ空調保守","あかつき冷蔵機器","なごみ食器","すずらん清掃","あおぞら廃棄物","つむぎ制服","かすみ防虫管理","ひかり電力サービス","しずく水道管理","そよかぜガス供給","やまぶき通信","わかば予約端末","うぐいす会計支援","ほたる警備","くるみ駐車場","つばさ配送","こはく厨房リース","もみじ店舗保険","つきみ農園","しおさい漁業組合","あさひ酒販","ゆうなぎ飲料","たんぽぽ製菓","ききょう乳業","ふたば鶏卵","りんどう香辛料","ひいらぎ包装資材","すみれ消耗品","なのはな販促","せせらぎ臨時仕入"];
const 見本金額=[42000,158000,136000,78000,36000,29000,24000,48000,68000,280000,22000,34000,18000,26000,31000,15000,12000,97000,24000,65000,19000,14000,33000,28000,44000,52000,59000,38000,76000,184000,126000,88000,45000,57000,64000,23000,39000,27000,35000,92000];
function 見本データを作る(){
  const masters=見本名称.map((payee,index)=>{const fixed=index<28;const type=index%7===5?"end":index%7===4?"weekday":"day";const day=index===0||index===2?31:index===1?30:5+(index*4)%25;return{id:"sample-"+(index+1),masterId:"p_"+String(index+1).padStart(4,"0"),payee,amount:index===2?見本金額[0]:見本金額[index],kind:fixed?"fixed":"variable",rule:{type,day,week:1+(index%4),weekday:1+(index%5)},account:index%3===0?"運営口座":index%3===1?"仕入口座":"経費口座",category:index===2?科目一覧[0]:科目一覧[index%科目一覧.length],memo:"架空の見本データ"}});
  return{format:バックアップ形式,version:1,masters,overrides:{},done:{},updatedAt:new Date().toISOString()};
}
function 空データを作る(){return{format:バックアップ形式,version:1,masters:[],overrides:{},done:{},updatedAt:new Date().toISOString()}} // 初回起動は空（見本はボタンで任意投入・2026-09-06）
let 保存データ=空データを作る();
let 保存領域を使える=true;
let 表示月=月キー(new Date());
let 取込表=[];
let 取込結果=[];

// ---- 日付と金額の共通処理 ----
function 全角を半角(value){return String(value).replace(/[０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-65248)).replace(/，/g,",").replace(/[−ー―‐]/g,"-").replace(/￥/g,"¥").trim()}
function 金額を読む(value){
  let text=全角を半角(value).replace(/\s*円$/,"").replace(/[¥￥\s,]/g,"");let negative=false;
  if(/^\(.+\)$/.test(text)){negative=true;text=text.slice(1,-1)}
  if(/^[▲△-]/.test(text)){negative=true;text=text.slice(1)}
  if(!/^\d+(?:\.\d+)?$/.test(text))return null;
  const amount=Number(text)*(negative?-1:1);return Number.isSafeInteger(amount)&&Math.abs(amount)<=金額上限?amount:null;
}
function 金額表示(value){return Number(value).toLocaleString("ja-JP")}
function 月キー(date){return date.getFullYear()+"-"+String(date.getMonth()+1).padStart(2,"0")}
function 月を移動(key,offset){const [year,month]=key.split("-").map(Number);return 月キー(new Date(year,month-1+offset,1))}
function 月の日数(year,month){return new Date(year,month,0).getDate()}
function 実在日付(dateText){if(!/^\d{4}-\d{2}-\d{2}$/.test(dateText))return false;const [y,m,d]=dateText.split("-").map(Number);const date=new Date(y,m-1,d);return date.getFullYear()===y&&date.getMonth()===m-1&&date.getDate()===d}
function 実在月(monthText){if(!/^\d{4}-\d{2}$/.test(monthText))return false;const [year,month]=monthText.split("-").map(Number);return year>=2000&&year<=2100&&month>=1&&month<=12}
function 支払日を求める(master,key){
  const [year,month]=key.split("-").map(Number);let day;
  if(master.rule.type==="end")day=月の日数(year,month);

function マスターを検証(item){
  if(!item||typeof item!=="object")return false;
  if(typeof item.id!=="string"||!item.id||item.id.includes("|")||typeof item.masterId!=="string"||!/^p_[a-z0-9]+$/i.test(item.masterId)||typeof item.payee!=="string"||!item.payee.trim()||item.payee.length>80)return false;
  if(!Number.isSafeInteger(item.amount)||Math.abs(item.amount)>金額上限)return false;
  if(!["fixed","variable"].includes(item.kind)||!item.rule||!["day","weekday","end"].includes(item.rule.type))return false;
  if(item.rule.type==="day"&&(!Number.isInteger(item.rule.day)||item.rule.day<1||item.rule.day>31))return false;
  if(item.rule.type==="weekday"&&(!Number.isInteger(item.rule.week)||item.rule.week<1||item.rule.week>5||!Number.isInteger(item.rule.weekday)||item.rule.weekday<1||item.rule.weekday>5))return false;

function 保存全体を検証(data){
  if(!data||data.format!==バックアップ形式||data.version!==1||!Array.isArray(data.masters)||typeof data.overrides!=="object"||data.overrides===null||typeof data.done!=="object"||data.done===null)return false;

  for(const [key,value] of Object.entries(data.overrides)){const parts=key.split("|");if(parts.length!==2||!実在月(parts[0])||!parts[1]||!Number.isSafeInteger(value)||Math.abs(value)>金額上限)return false}
  for(const [key,value] of Object.entries(data.done)){const parts=key.split("|");if(parts.length!==2||!実在月(parts[0])||!parts[1]||typeof value!=="boolean")return false}
  return typeof data.updatedAt==="string"&&!Number.isNaN(Date.parse(data.updatedAt));

function 取込を検証(){const selects=[...document.querySelectorAll("#mappingArea select")];const map={};selects.forEach(select=>{if(select.value!=="skip")map[select.value]=Number(select.dataset.column)});const missing=["payee","amount","date"].filter(key=>map[key]===undefined);if(missing.length){通知("相手・金額・支払日の列をそれぞれ選んでください。",true);return}const rows=取込表.slice(document.getElementById("hasHeader").checked?1:0);取込結果=rows.map((row,index)=>{const line=index+(document.getElementById("hasHeader").checked?2:1);const payee=(row[map.payee]||"").trim();const amount=金額を読む(row[map.amount]||"");const rule=取込支払日を読む(row[map.date]||"");const kindText=(row[map.kind]||"固定").trim();const kind=/変動/.test(kindText)?"variable":/固定/.test(kindText)||!kindText?"fixed":null;const reasons=[];if(!payee)reasons.push("相手が空です");if(payee.length>80)reasons.push("相手が長すぎます");if(amount===null)reasons.push("金額を数字として読めません");if(!rule)reasons.push("支払日が正しくありません");if(!kind)reasons.push("区分は固定か変動で入力してください");const categoryText=map.category===undefined?"":(row[map.category]||"").trim();const category=科目一覧.find(name=>categoryText&&(categoryText===name||categoryText.startsWith(name)||name.startsWith(categoryText)))||"その他";const master=reasons.length?null:{id:"pay-"+Date.now()+"-"+index+"-"+Math.random().toString(36).slice(2,6),payee,amount,kind,rule,account:map.account===undefined?"":(row[map.account]||"").trim().slice(0,50),category,memo:map.memo===undefined?"":(row[map.memo]||"").trim().slice(0,300)};return{line,reasons,master}});プレビューを描画()}
function プレビューを描画(){const good=取込結果.filter(x=>x.master);const bad=取込結果.filter(x=>!x.master);document.getElementById("previewSummary").textContent="正常 "+good.length+"行・除外 "+bad.length+"行";const lines=document.getElementById("previewLines");lines.replaceChildren();取込結果.forEach(result=>{const text=result.master?result.line+"行目: "+result.master.payee+" / "+金額表示(result.master.amount)+"円":result.line+"行目を除外: "+result.reasons.join("、");lines.append(要素("div","preview-line"+(result.master?"":" error"),text))});document.getElementById("executeImport").classList.toggle("hidden",good.length===0)}
function 正常行を取り込む(){const good=取込結果.filter(x=>x.master).map(x=>x.master);good.forEach(master=>{master.masterId=新しい安定ID();保存データ.masters.push(master)});保存する();全体を描画();通知(good.length+"行を取り込みました。除外行は追加していません。");取込結果=[];document.getElementById("executeImport").classList.add("hidden")}
function 一括解析を始める(){try{取込表=表を解析(document.getElementById("pasteArea").value);if(!取込表.length){通知("CSVファイルを選ぶか、表を貼り付けてください。",true);return}対応欄を作る()}catch(error){通知("表を読み取れませんでした。内容を確認してください。",true)}}

// ---- 操作の登録 ----
document.getElementById("addButton").addEventListener("click",()=>編集画面を開く());document.getElementById("cancelDialog").addEventListener("click",()=>document.getElementById("masterDialog").close());document.getElementById("masterForm").addEventListener("submit",フォームを保存);document.getElementById("ruleInput").addEventListener("change",日付欄を切替);document.getElementById("prevMonth").addEventListener("click",()=>{表示月=月を移動(表示月,-1);予定を描画()});document.getElementById("nextMonth").addEventListener("click",()=>{表示月=月を移動(表示月,1);予定を描画()});document.getElementById("showDone").addEventListener("change",予定を描画);
document.getElementById("demoButton").addEventListener("click",()=>{if(保存データ.masters.length>0&&!window.confirm("今のデータをすべて消して、見本データ40件（架空）に置き換えます。よろしいですか？"))return;保存データ=見本データを作る();保存する();全体を描画();通知("見本データ40件（架空）を入れました。")});document.getElementById("clearButton").addEventListener("click",()=>{if(!window.confirm("すべての支払先・金額・支払済み記録を消して白紙に戻します。よろしいですか？"))return;保存データ=空データを作る();保存する();全体を描画();通知("白紙に戻しました。")});
document.getElementById("backupButton").addEventListener("click",()=>ファイルを保存("支払期日管理_バックアップ.json",バックアップ文字列(),"application/json"));document.getElementById("icsButton").addEventListener("click",()=>ファイルを保存("支払予定.ics",カレンダー文字列(),"text/calendar;charset=utf-8"));document.getElementById("paymentsButton").addEventListener("click",()=>ファイルを保存("支払予定_資金繰り用.json",資金繰り文字列(),"application/json"));document.getElementById("backupInput").addEventListener("change",event=>{const file=event.target.files[0];if(file)バックアップを読む(file)});
document.getElementById("csvFile").addEventListener("change",async event=>{const file=event.target.files[0];if(!file)return;try{document.getElementById("pasteArea").value=await file.text();取込表=表を解析(document.getElementById("pasteArea").value);対応欄を作る()}catch(error){通知("CSVファイルを読み取れませんでした。",true)}});document.getElementById("analyzeImport").addEventListener("click",一括解析を始める);document.getElementById("previewImport").addEventListener("click",取込を検証);document.getElementById("executeImport").addEventListener("click",正常行を取り込む);

// ---- 検収用フック（画面やダウンロードを動かさず内容を返す） ----
window.__test__={getBackup:バックアップ文字列,getIcs:カレンダー文字列,getPaymentsJson:資金繰り文字列,getSchedule:予定を作る,parseAmount:金額を読む,formatAmount:金額表示,parseImportTable:表を解析,validateImportRows:function(text,mapping,hasHeader=true){取込表=表を解析(text);const fake=[];Object.entries(mapping).forEach(([key,index])=>{const select=document.createElement("select");select.dataset.column=String(index);const option=document.createElement("option");option.value=key;option.textContent=key;select.append(option);select.value=key;fake.push(select)});const area=document.getElementById("mappingArea");area.replaceChildren(...fake);document.getElementById("hasHeader").checked=hasHeader;取込を検証();return 取込結果.map(x=>({line:x.line,ok:Boolean(x.master),reasons:x.reasons,master:x.master}))},validateData:保存全体を検証};

// ---- 安全な起動 ----
サイドバーを描画(); // データの読み込みに失敗してもサイドバーは出す
try{保存データ=起動データを読む();全体を描画();if(!保存領域を使える)通知("この開き方ではデータを保存できません。画面は使えますが、閉じると入力が消えます。",true)}catch(error){初期状態へ戻す("保存データが壊れていたため読み込めませんでした。");try{全体を描画()}catch(secondError){document.getElementById("message").textContent="画面を表示できませんでした。ファイルを開き直してください。";document.getElementById("message").className="notice show error"}}
</script>
